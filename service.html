<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service — YD Detailers</title>
<meta name="description" content="Premium mobile car detailing in the Greater Boston area. Choose your package and book online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#5b7cfa;--blue-dark:#4a68e0;--blue-light:#7b96fb;
  --gold:#cbab68;
  --grad-bg:linear-gradient(160deg,#060d1f 0%,#06090f 35%,#040409 65%,#000 100%);
  --card:#111118;--card2:#16161f;--border:rgba(255,255,255,0.08);
  --text:#fff;--muted:#9ca3b8;
  --font:Calibri,'Segoe UI',Tahoma,sans-serif;--font-body:Calibri,'Segoe UI',Tahoma,sans-serif;
  --serif:Cambria,Georgia,'Times New Roman',serif;
}
html{scroll-behavior:smooth;}
body{background:var(--grad-bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;background:rgba(0,0,0,0.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(91,124,250,0.45);}
.nl{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nl-name{font-size:18px;font-weight:800;color:#fff;letter-spacing:0.4px;}
.nav-back{color:rgba(255,255,255,0.8);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid rgba(255,255,255,0.14);border-radius:50px;transition:all .2s;}
.nav-back:hover{background:rgba(255,255,255,0.06);color:#fff;}

/* HERO */
.svc-hero{position:relative;height:52vh;min-height:340px;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid rgba(91,124,250,0.45);}
.svc-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.svc-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(4,6,12,1) 0%,rgba(4,6,12,0.55) 45%,rgba(4,6,12,0.35) 100%);}
.svc-hero-inner{position:relative;z-index:2;max-width:1000px;margin:0 auto;width:100%;padding:0 32px 44px;}
.svc-kicker{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue-light);margin-bottom:12px;}
.svc-title{font-family:var(--serif);font-weight:500;font-size:clamp(40px,7vw,68px);line-height:1.02;letter-spacing:0.5px;margin-bottom:14px;}
.svc-tagline{font-size:17px;color:rgba(255,255,255,0.78);line-height:1.6;max-width:620px;}

/* BODY */
.wrap{max-width:1000px;margin:0 auto;padding:40px 32px 64px;}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:start;}
.block-lbl{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}
.inc-list{list-style:none;display:flex;flex-direction:column;gap:14px;}
.inc-list li{display:flex;align-items:flex-start;gap:13px;font-size:16px;line-height:1.5;color:rgba(255,255,255,0.9);}
.ck{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:rgba(91,124,250,0.16);border:1px solid rgba(91,124,250,0.4);color:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px;}
.meta{margin-top:34px;display:flex;flex-direction:column;gap:18px;}
.meta-row{display:flex;gap:14px;align-items:flex-start;}
.meta-icon{flex-shrink:0;width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;}
.meta-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.meta-val{font-size:14.5px;color:rgba(255,255,255,0.85);line-height:1.5;}
.meta-val.blue{color:var(--blue-light);}
.addons-list{display:flex;flex-direction:column;gap:9px;margin-top:8px;}
.addon-item{display:flex;align-items:flex-start;gap:11px;background:var(--card2);border:1px solid rgba(91,124,250,0.22);border-radius:11px;padding:11px 14px;transition:border-color .2s,background .2s;cursor:pointer;user-select:none;-webkit-user-select:none;}
.addon-item:hover{border-color:rgba(91,124,250,0.45);}
.addon-item.selected{border-color:var(--blue);background:rgba(91,124,250,0.12);}
.addon-plus{flex-shrink:0;width:21px;height:21px;border-radius:50%;background:rgba(91,124,250,0.16);border:1px solid rgba(91,124,250,0.4);color:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1;margin-top:1px;transition:all .2s;}
.addon-item.selected .addon-plus{background:var(--blue);border-color:var(--blue);color:#fff;}
.addons-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4;}
.addon-name{font-size:14.5px;font-weight:600;color:#fff;line-height:1.35;}
.addon-desc{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px;}

/* PICKER CARD */
.picker{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;position:sticky;top:88px;}
.picker h3{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:6px;}
.picker .psub{font-size:13.5px;color:var(--muted);margin-bottom:22px;line-height:1.5;}
.veh-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.veh-toggle{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:26px;}
.veh-btn{padding:12px 6px;border:none;background:transparent;color:rgba(255,255,255,0.65);font-family:var(--font-body);font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;transition:all .2s;text-align:center;}
.veh-btn.active{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(91,124,250,0.4);}
.price-display{text-align:center;margin-bottom:8px;}
.price-display .amt{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1;}
.price-display .lbl{font-size:13px;color:var(--muted);margin-top:8px;}
.time-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--muted);margin:18px 0 24px;}
.book-btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;padding:17px;border-radius:50px;font-size:16px;font-weight:700;text-decoration:none;transition:all .2s;border:none;cursor:pointer;font-family:var(--font-body);}
.book-btn:hover{background:var(--blue-dark);transform:translateY(-2px);box-shadow:0 10px 30px rgba(91,124,250,0.45);}
.book-note{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5;}

@media(max-width:860px){
  .cols{grid-template-columns:1fr;gap:38px;}
  .picker{position:static;order:-1;}
  nav{padding:0 18px;}
  .svc-hero-inner,.wrap{padding-left:20px;padding-right:20px;}
  .wrap{padding-top:36px;padding-bottom:60px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html#services" class="nl"><span class="nl-name">YD DETAILERS</span></a>
  <a href="index.html#services" class="nav-back">&#8592; Back to services</a>
</nav>

<section class="svc-hero">
  <img id="heroImg" src="" alt="">
  <div class="svc-hero-inner">
    <div class="svc-kicker">Service</div>
    <h1 class="svc-title" id="svcTitle"></h1>
    <p class="svc-tagline" id="svcTagline"></p>
  </div>
</section>

<div class="wrap">
  <div class="cols">
    <div class="left">
      <div class="block-lbl">What's Included</div>
      <ul class="inc-list" id="incList"></ul>
      <div class="meta" id="metaBox"></div>
    </div>

    <div class="picker">
      <h3>Build your detail</h3>
      <p class="psub">Select your vehicle size to see pricing, then book your spot.</p>
      <div class="veh-lbl">Vehicle</div>
      <div class="veh-toggle" id="vehToggle">
        <button class="veh-btn active" data-veh="Sedan" onclick="setVeh('Sedan')">Sedan</button>
        <button class="veh-btn" data-veh="SUV" onclick="setVeh('SUV')">SUV</button>
        <button class="veh-btn" data-veh="Truck" onclick="setVeh('Truck')">Truck</button>
      </div>
      <div class="price-display">
        <div class="amt" id="priceAmt">$0</div>
        <div class="lbl" id="priceLbl">Starting price · Sedan</div>
      </div>
      <div class="time-row"><span>&#128336;</span> <span id="timeVal"></span></div>
      <a class="book-btn" id="bookBtn" href="#">Book Now &#8594;</a>
      <div class="book-note">Free cancellation up to 12h prior · Fully insured</div>
    </div>
  </div>
</div>

<script>
const SERVICES = {
  exterior: {
    name: 'Premium Exterior Detail',
    tagline: 'A proper exterior reset — washed, decontaminated, and finished so the paint looks deep and the car turns heads again.',
    img: 'assets/svc-exterior.jpg',
    prices: { Sedan: 90, SUV: 100, Truck: 120 },
    time: '~1–2 hours',
    included: [
      'Pre-rinse and pressure wash',
      'Two-bucket hand wash with microfiber mitt',
      'Deep cleaning of wheels, rims, and tires',
      'Tire dressing for a clean, satin finish',
      'Spray-on, rinse-off sealant',
      'Microfiber towel dry'
    ],
    idealFor: 'Drivers who want a fresh, glossy exterior without interior work.',
    addons: [
      { id: 'ceramic', price: 50, name: 'Ceramic Coating', desc: 'Long-lasting ceramic layer for deep gloss and water-beading protection.' },
      { id: 'clay', price: 40, name: 'Clay Bar Treatment', desc: 'Strips bonded contaminants for a glass-smooth finish.' },
      { id: 'enginebay', price: 50, name: 'Engine Bay Cleaning', desc: 'Degreased and dressed for a showroom-clean engine bay.' },
      { id: 'sap', price: 35, name: 'Tree Sap Removal', desc: 'Safe removal of hardened sap before it etches the clear coat.' },
      { id: 'wax', price: 35, name: 'Wax Sealant', desc: 'Hand-applied wax for extra shine and weeks of protection.' }
    ]
  },
  interior: {
    name: 'Interior Reset Detail',
    tagline: 'A full interior refresh designed to restore cleanliness and create a like-new feel inside the cabin.',
    img: 'assets/svc-interior.jpg',
    prices: { Sedan: 150, SUV: 180, Truck: 200 },
    time: '~1.5–2.5 hours',
    included: [
      'Full vacuum: carpets, seats, floor mats, trunk',
      'Floor mats cleaned and wiped',
      'Wipe-down & scrubbing of interior surfaces',
      'UV protection applied to plastics and vinyl',
      'Leather seats cleaned (if applicable)',
      'Streak-free interior glass cleaning'
    ],
    idealFor: 'Daily drivers and family vehicles that need interior renewal.',
    addons: [
      { id: 'pethair', price: 30, name: 'Pet Hair Removal', desc: 'Deep extraction of embedded pet hair that vacuuming alone misses.' },
      { id: 'protectant', price: 30, name: 'Interior Protectant', desc: 'UV-blocking coat that guards plastics, vinyl, and leather.' },
      { id: 'trim', price: 35, name: 'Mat Restoration', desc: 'Deep-scrubbed and refreshed floor mats.' }
    ]
  },
  full: {
    name: 'Signature Full Vehicle Detail',
    tagline: 'Our most popular service. A complete inside-and-out transformation that combines both exterior and interior detailing.',
    img: 'assets/svc-full.jpg',
    prices: { Sedan: 220, SUV: 260, Truck: 300 },
    time: '~2.5–4 hours',
    included: [
      'Exterior: Pressure wash & two-bucket hand wash',
      'Wheel, rim, and tire cleaning & dressing',
      'Spray-on, rinse-off sealant & towel dry',
      'Interior: Full vacuum (including trunk)',
      'Detailed wipe-down & UV protection',
      'Leather cleaning & streak-free glass'
    ],
    idealFor: 'New customers, cars being prepped for sale, or anyone who wants a full reset.',
    addons: [
      { id: 'ceramic', price: 50, name: 'Ceramic Coating', desc: 'Long-lasting ceramic layer for deep gloss and water-beading protection.' },
      { id: 'clay', price: 40, name: 'Clay Bar Treatment', desc: 'Strips bonded contaminants for a glass-smooth finish.' },
      { id: 'enginebay', price: 50, name: 'Engine Bay Cleaning', desc: 'Degreased and dressed for a showroom-clean engine bay.' },
      { id: 'sap', price: 35, name: 'Tree Sap Removal', desc: 'Safe removal of hardened sap before it etches the clear coat.' },
      { id: 'wax', price: 35, name: 'Wax Sealant', desc: 'Hand-applied wax for extra shine and weeks of protection.' },
      { id: 'pethair', price: 30, name: 'Pet Hair Removal', desc: 'Deep extraction of embedded pet hair that vacuuming alone misses.' },
      { id: 'protectant', price: 30, name: 'Interior Protectant', desc: 'UV-blocking coat that guards plastics, vinyl, and leather.' },
      { id: 'trim', price: 35, name: 'Mat Restoration', desc: 'Deep-scrubbed and refreshed floor mats.' }
    ]
  }
};

function getParam(name){ return new URLSearchParams(location.search).get(name); }
let id = getParam('id');
if (!SERVICES[id]) id = 'full';
const svc = SERVICES[id];
let veh = 'Sedan';

document.title = svc.name + ' — YD Detailers';
document.getElementById('heroImg').src = svc.img;
document.getElementById('heroImg').alt = svc.name;
document.getElementById('svcTitle').textContent = svc.name;
document.getElementById('svcTagline').textContent = svc.tagline;
document.getElementById('timeVal').textContent = svc.time;

document.getElementById('incList').innerHTML = svc.included
  .map(x => `<li><span class="ck">&#10003;</span>${x}</li>`).join('');

document.getElementById('metaBox').innerHTML = `
  <div class="meta-row"><div class="meta-icon">&#9733;</div><div><div class="meta-lbl">Ideal For</div><div class="meta-val">${svc.idealFor}</div></div></div>
  <div class="meta-row"><div class="meta-icon">&#128336;</div><div><div class="meta-lbl">Time Estimate</div><div class="meta-val">${svc.time}</div></div></div>
  <div class="meta-row"><div class="meta-icon">+</div><div style="flex:1;min-width:0;"><div class="meta-lbl">Add-ons — tap to add</div><div class="addons-list">${svc.addons.map(a => `<div class="addon-item" id="addon-${a.id}" onclick="toggleAddonSel('${a.id}')"><span class="addon-plus" id="aplus-${a.id}">+</span><div><div class="addon-name">${a.name}</div><div class="addon-desc">${a.desc}</div></div></div>`).join('')}</div><div class="addons-hint">Anything you pick here carries over to your booking.</div></div></div>`;

const selectedAddons = new Set();
function toggleAddonSel(addonId){
  const card = document.getElementById('addon-' + addonId);
  const plus = document.getElementById('aplus-' + addonId);
  if (selectedAddons.has(addonId)) {
    selectedAddons.delete(addonId);
    card.classList.remove('selected');
    plus.innerHTML = '+';
  } else {
    selectedAddons.add(addonId);
    card.classList.add('selected');
    plus.innerHTML = '&#10003;';
  }
  render();
}

function setVeh(v){
  veh = v;
  document.querySelectorAll('.veh-btn').forEach(b => b.classList.toggle('active', b.dataset.veh === v));
  render();
}
function render(){
  let total = svc.prices[veh];
  svc.addons.forEach(a => { if (selectedAddons.has(a.id)) total += (a.price || 0); });
  const n = selectedAddons.size;
  document.getElementById('priceAmt').textContent = '$' + total;
  document.getElementById('priceLbl').textContent = n
    ? `${veh} + ${n} add-on${n > 1 ? 's' : ''}`
    : 'Starting price · ' + veh;
  let href = `booking.html?service=${id}&vehicle=${veh}`;
  if (n) href += `&addons=${[...selectedAddons].join(',')}`;
  document.getElementById('bookBtn').href = href;
}
render();
</script>
</body>
</html>
